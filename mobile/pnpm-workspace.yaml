allowBuilds:
  esbuild: true

# Keep every metro package on the release @expo/metro pins exactly. react-native depends on
# them with caret ranges, which otherwise resolve a newer patch than the Expo dev server runs.
overrides:
  metro: 0.84.5
  metro-babel-transformer: 0.84.5
  metro-cache: 0.84.5
  metro-cache-key: 0.84.5
  metro-config: 0.84.5
  metro-core: 0.84.5
  metro-file-map: 0.84.5
  metro-minify-terser: 0.84.5
  metro-resolver: 0.84.5
  metro-runtime: 0.84.5
  metro-source-map: 0.84.5
  metro-symbolicate: 0.84.5
  metro-transform-plugins: 0.84.5
  metro-transform-worker: 0.84.5
